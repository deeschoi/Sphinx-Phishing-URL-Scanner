# Train, migrate, and promote a Vercel deploy only after the staged URL
# passes the smoke tests. Git deploys are off (vercel.json), so this workflow
# is the only path that publishes a model.
#
# GitHub environment: production
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   PHISHING_DATABASE_URL   production Neon branch, pooled connection string
#   VERCEL_AUTOMATION_BYPASS_SECRET   optional, only if the staged URL is protected
#
# The function's runtime env (Redis, QStash, CRON_SECRET, anonymous opt-in)
# lives on the Vercel project, not in this file. Never put GROQ_API_KEY or
# SPHINX_API_KEY there.
#
# Training uses requirements-serve.txt. requirements.txt pins xgboost==2.1.4,
# whose Linux wheel needs nvidia-nccl-cu12, and that library does not fit the
# function. The booster has to be pickled by the same xgboost-cpu the
# function imports. Docker CI still trains from requirements.txt.

name: Deploy Vercel

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # requirements-serve.txt unpacks to ~330 MB. The custom install command
      # blocks Vercel's 225 MB packing path; this opts the build into large
      # functions (up to 5 GB). scripts/vercel_build.sh sets it again.
      VERCEL_SUPPORT_LARGE_FUNCTIONS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serve.txt

      - name: Train the served model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt
          pip install -e . --no-deps
          python scripts/06_train_final.py

      - name: Migrate the production Neon branch
        env:
          PHISHING_DATABASE_URL: ${{ secrets.PHISHING_DATABASE_URL }}
        run: alembic upgrade head

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install the Vercel CLI
        # 48.12.1 rejects `functions.app.py`: it only matches files inside
        # `api/`. 65.14.0 accepts that pattern for the FastAPI entrypoint and
        # still has `vercel deploy --skip-domain`.
        run: npm install -g vercel@65.14.0

      - name: Protect preview deployments
        run: sh scripts/ensure_preview_protection.sh

      - name: Install uv
        # CLI 65 builds the Python function with uv (uv.lock / requirements).
        # ubuntu-latest does not ship it, so `vercel build` exits with
        # `[UV_ERROR] uv is required but was not found in PATH`.
        # Cache is off: this job only needs the binary, and the token has
        # contents: read, which cannot write the Actions cache.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build and refuse an oversized function
        run: sh scripts/vercel_build.sh

      - name: Deploy without taking the production domain
        id: deploy
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --skip-domain --yes --token "$VERCEL_TOKEN" \
            | tee /tmp/vercel-deploy.txt
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.vercel\.app' /tmp/vercel-deploy.txt | tail -n 1)
          if [ -z "$url" ]; then
            echo "deploy did not print a deployment URL" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the staged deploy
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python scripts/smoke_vercel.py "${{ steps.deploy.outputs.url }}"

      - name: Promote
        run: vercel promote "${{ steps.deploy.outputs.url }}" --yes --token "$VERCEL_TOKEN"
