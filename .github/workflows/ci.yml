name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      live_eval:
        description: Run the live sample eval (network, several minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # scipy 1.17 requires Python 3.11+; 3.12 matches the Docker runtime.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Test
        run: pytest -m "not network" -q

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check .

  imports:
    # The analysis scripts and the API are not covered by unit tests end to end.
    # Importing every module catches the package-drift class of breakage, where
    # a helper is renamed in src/phishing and its callers are left behind.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Import every entry point
        run: python scripts/check_imports.py

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck, test, and build
        run: |
          npx tsc --noEmit
          npm test
          npm run build

  audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit production npm dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=moderate

  docker:
    # Trains the model as part of the build, so this also proves the pipeline
    # runs end to end on a clean checkout. actions: write is the buildx cache.
    permissions:
      contents: read
      actions: write
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: phishing-scanner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          # Same peer problem as compose: the runner curls 127.0.0.1:8000, but
          # inside the container the TCP peer is the Docker bridge (172.17.0.1),
          # not loopback. Default SPHINX_ALLOW_ANONYMOUS=loopback would 401
          # every /api/scan. Bind loopback so the runner port is not world-
          # reachable; private covers the RFC1918 bridge gateway.
          docker run -d --name scanner \
            -p 127.0.0.1:8000:8000 \
            -e SPHINX_ALLOW_ANONYMOUS=private \
            phishing-scanner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "healthy"; break
            fi
            if [ "$i" = "30" ]; then
              echo "API never became healthy"; docker logs scanner; exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/ready
          curl -fsS http://127.0.0.1:8000/api/model | head -c 400
          curl -fsS http://127.0.0.1:8000/ | grep -q "Sphinx"
          curl -fsS http://127.0.0.1:8000/history | grep -q "Sphinx"

          # The scan path was never smoke-tested in the container. A private
          # target must be refused, and a well-formed request must return a
          # scored payload rather than a 500 from a missing artifact.
          for target in "http://127.0.0.1/" "http://169.254.169.254/latest/meta-data/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              http://127.0.0.1:8000/api/scan \
              -H 'Content-Type: application/json' \
              -d "{\"url\": \"$target\"}")
            if [ "$code" != "403" ]; then
              echo "SSRF guard did not refuse $target (got $code)"
              docker logs scanner; exit 1
            fi
          done

          curl -fsS -X POST http://127.0.0.1:8000/api/scan \
            -H 'Content-Type: application/json' \
            -d '{"url": "https://example.com"}' | grep -q '"verdict"'

          docker rm -f scanner

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: phishing-scanner:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  live-eval:
    # Off the PR path: needs the network and several minutes. Weekly plus a
    # workflow_dispatch checkbox so the live_sample numbers in the UI can be
    # refreshed without blocking every push.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.live_eval == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Train if the artifact is missing
        run: |
          if [ ! -f artifacts/model.joblib ]; then
            python -m phishing.cli train
          fi

      - name: Live sample eval
        run: python scripts/07_live_sample_eval.py --seed 7 --n-per-class 120

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-sample-eval
          path: reports/phiusiil_live_sample_eval.json

