[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing"
version = "0.1.0"
description = "Sphinx: live phishing scanner trained on PhiUSIIL (2023)"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
phishing = "phishing.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "network: tests that require outbound network access",
]
filterwarnings = [
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "research/notebooks", "*.ipynb", "web/node_modules", "web/dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # The analysis scripts must call matplotlib.use("Agg") before importing
    # pyplot, so their imports cannot all sit at the top of the file.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports for convenience, not dead imports.
"src/phishing/__init__.py" = ["F401"]
"src/phishing/features/__init__.py" = ["F401"]
