services:
  api:
    build: .
    image: phishing-scanner:latest
    # 127.0.0.1 only. Publishing 8000 on every interface exposes an endpoint
    # that makes outbound HTTP requests on a caller's behalf; put a reverse
    # proxy in front and set SPHINX_API_KEY before changing this.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PHISHING_ROOT: /app
      PHISHING_DATABASE_URL: ${PHISHING_DATABASE_URL:-sqlite:////app/data/scans.db}
      SPHINX_API_KEY: ${SPHINX_API_KEY:-}
      # Publish is 127.0.0.1:8000, but inside the container the peer is the
      # Docker bridge gateway (e.g. 172.17.0.1), which is not loopback. This
      # declares that already-restricted publish to an app that cannot see it.
      SPHINX_ALLOW_ANONYMOUS: ${SPHINX_ALLOW_ANONYMOUS:-1}
      SPHINX_SCAN_RATE_PER_MINUTE: ${SPHINX_SCAN_RATE_PER_MINUTE:-20}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - scan-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # The entrypoint starts as root only long enough to chown the data volume,
    # then gosu drops to scanner. These are the capabilities that drop needs.
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 1.5
    restart: unless-stopped

  # Opt in with: docker compose --profile postgres up
  # Compose interpolates inactive profiles too, so ${VAR:?} would break the
  # default SQLite path. Leave these unset unless you enable the profile.
  # The postgres image refuses to start with an empty POSTGRES_PASSWORD, so
  # there is still no baked-in default password.
  db:
    profiles: [postgres]
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-phishing}
    # Not published: only the api service needs it, over the compose network.
    expose:
      - "5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  scan-data:
  pg-data:
